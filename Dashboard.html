<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Navigation */
        nav {
            background: #1E293B;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-name {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: #38BDF8;
        }

        /* Dashboard Content */
        .dashboard {
            padding: 20px;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            text-align: center;
        }

        .box i {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .total-projects { background: #38BDF8; color: white; }
        .ongoing-tasks { background: #FACC15; color: white; }
        .completed-tasks { background: #10B981; color: white; }

    </style>
</head>
<body>
    <nav>
        <div class="logo-name">Project Management</div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="projects.html"><i class="fas fa-project-diagram"></i> Projects</a></li>
            <li><a href="team.html"><i class="fas fa-users"></i> Team</a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li><a href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <section class="dashboard">
        <h1>Dashboard</h1>
        <div class="stats">
            <div class="box total-projects">
                <i class="fas fa-folder-open"></i>
                <p>Total Projects</p>
                <span>25</span>
            </div>
            <div class="box ongoing-tasks">
                <i class="fas fa-tasks"></i>
                <p>Ongoing Tasks</p>
                <span>12</span>
            </div>
            <div class="box completed-tasks">
                <i class="fas fa-check-circle"></i>
                <p>Completed Tasks</p>
                <span>40</span>
            </div>
        </div>
    </section>
</body>
</html>

<mat-card>
  <app-name-page [page]="page"></app-name-page>

  <div class="overflow-auto rounded-xl border border-blue-100 bg-white">
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8 min-w-full"
      matSort
    >
      <ng-container matColumnDef="position">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          class="bg-blue-100 text-blue-700 font-semibold"
        >
          No.
        </th>
        <td mat-cell *matCellDef="let element" class="py-3">
          {{ element.position }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          class="bg-blue-100 text-blue-700 font-semibold"
        >
          Name
        </th>
        <td mat-cell *matCellDef="let element" class="py-3">
          {{ element.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="weight">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          class="bg-blue-100 text-blue-700 font-semibold"
        >
          Weight
        </th>
        <td mat-cell *matCellDef="let element" class="py-3">
          {{ element.weight }}
        </td>
      </ng-container>

      <ng-container matColumnDef="symbol">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          class="bg-blue-100 text-blue-700 font-semibold"
        >
          Symbol
        </th>
        <td mat-cell *matCellDef="let element" class="py-3">
          {{ element.symbol }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="hover:bg-blue-50 cursor-pointer transition-all rounded-lg"
      ></tr>
    </table>
  </div>

  <mat-paginator
    [pageSize]="5"
    showFirstLastButtons
    class="mt-6 rounded-lg border border-blue-100"
  ></mat-paginator>
</mat-card>

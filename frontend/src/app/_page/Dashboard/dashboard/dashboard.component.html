<mat-card>
  <app-name-page [page]="page"></app-name-page>
  <app-table
    [data]="data"
    [count]="count"
    [columns]="columns"
    (pageChanged)="onPageChanged($event)"
    (sortChanged)="onSortChanged($event)"
    [enableDblClickForRow]="true"
    (onExport)="onExport()"
  ></app-table>
</mat-card>

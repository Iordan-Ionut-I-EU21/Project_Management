<mat-card>
  <div class="flex flex-col items-center text-center">
    <div class="profile-image mb-4">
      <div class="text-4xl font-bold text-gray-700">
        {{ onGetFirstLetter() }}
      </div>
    </div>
    <div class="w-full flex flex-col items-center">
      <h2 class="important-medium-text">{{ user!.name }}</h2>
      <p class="important-small-text">{{ user!.email }}</p>
      <span class="important-text">
        {{ user!.role }}
      </span>
    </div>
  </div>
  <div class="flex flex-col">
    <div class="flex flex-row justify-between mt-4">
      <app-charts-pie
        [pieChartData]="pieChartDataLOW"
        [pieChartOptions]="pieChartOptionsLOW"
        [hasValue]="hasValue"
      ></app-charts-pie>
      <app-charts-pie
        [pieChartData]="pieChartDataHIGH"
        [pieChartOptions]="pieChartOptionsHIGH"
        [hasValue]="hasValue"
      ></app-charts-pie>
      <app-charts-pie
        [pieChartData]="pieChartDataMEDIUM"
        [pieChartOptions]="pieChartOptionsMEDIUM"
        [hasValue]="hasValue"
      ></app-charts-pie>
    </div>
    <div class="flex flex-row justify-center items-center mt-4">
      <app-charts-pie
        [pieChartData]="pieChartDataROLE"
        [pieChartOptions]="pieChartOptionsROLE"
        [hasValue]="hasValueROLE"
      ></app-charts-pie>
    </div>
  </div>
</mat-card>

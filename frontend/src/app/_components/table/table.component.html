<div class="overflow-auto rounded-xl border border-blue-100 bg-white">
  <table
    mat-table
    [dataSource]="dataSource"
    class="min-w-full mat-elevation-z8"
    matSort
  >
    <ng-container *ngFor="let col of columns" [matColumnDef]="col.code">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        class="bg-blue-100 font-semibold"
      >
        {{ col.label }}
      </th>

      <td mat-cell *matCellDef="let row">
        <ng-container [ngSwitch]="col.type">
          <span *ngSwitchCase="'text'">
            {{ getNestedValue(row, col.key) }}</span
          >
          <a
            *ngSwitchCase="'link'"
            (click)="onGoToLink(row, col.link?.url, col.link?.code)"
          >
            {{ getNestedValue(row, col.key) }}
          </a>
          <ng-container *ngSwitchCase="'button'">
            <ng-container *ngFor="let btn of col.buttons">
              <button
                mat-raised-button
                [color]="btn.buttonColor || 'primary'"
                (click)="btn.onClick?.(row)"
                class="mr-1"
              >
                <mat-icon>{{ btn.icon }}</mat-icon>
                {{ btn.buttonText }}
              </button>
            </ng-container>
          </ng-container>
        </ng-container>
        <ng-container [ngSwitch]="col.pipe">
          <span *ngSwitchCase="'date'">
            {{ row[col.key] | date : "dd MMM yyyy" }}
          </span>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnKeys"></tr>
  </table>
</div>
<mat-paginator
  [length]="count"
  [pageSize]="pageSize"
  class="mt-6 rounded-lg border border-blue-100"
></mat-paginator>

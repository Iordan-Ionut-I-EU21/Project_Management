<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        /* Navigation Bar */
        nav {
            background: #1E293B;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #38BDF8;
        }

        /* Content */
        .content {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        /* Project List */
        .project-card {
            background: #ffffff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edit-btn, .delete-btn {
            cursor: pointer;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 5px;
            border: none;
            color: white;
            transition: 0.3s;
        }

        .edit-btn { background: #FACC15; }
        .delete-btn { background: #EF4444; }

        .edit-btn:hover { background: #D97706; }
        .delete-btn:hover { background: #DC2626; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        .modal input, .modal select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        #saveProjectBtn {
            background: #10B981;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-name">Project Management</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="projects.html" class="active">Projects</a></li>
            <li><a href="team.html">Team</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>

    <section class="content">
        <h1>Projects</h1>
        <button id="addProjectBtn">➕ Add Project</button>
        <div id="projectsContainer"></div>
    </section>

    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add Project</h2>
            <input type="hidden" id="editIndex">
            <input type="text" id="projectName" placeholder="Project Name">
            <input type="text" id="projectTeam" placeholder="Assigned Team">
            <select id="projectStatus">
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
            </select>
            <button id="saveProjectBtn">Save Project</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const addProjectBtn = document.getElementById("addProjectBtn");
            const modal = document.getElementById("projectModal");
            const saveProjectBtn = document.getElementById("saveProjectBtn");
            const projectsContainer = document.getElementById("projectsContainer");
            let projects = JSON.parse(localStorage.getItem("projects")) || [];
            let editIndex = -1;

            function renderProjects() {
                projectsContainer.innerHTML = "";
                projects.forEach((project, index) => {
                    const projectCard = document.createElement("div");
                    projectCard.classList.add("project-card");
                    projectCard.innerHTML = `
                        <span>${project.name} (${project.status}) - Team: ${project.team}</span>
                        <button class="edit-btn" onclick="editProject(${index})">✏ Edit</button>
                        <button class="delete-btn" onclick="deleteProject(${index})">🗑 Delete</button>
                    `;
                    projectsContainer.appendChild(projectCard);
                });

                // Trimitem proiectele și în Dashboard
                localStorage.setItem("recentActivities", JSON.stringify(projects.slice(-3))); 
            }

            addProjectBtn.addEventListener("click", function () {
                modal.style.display = "flex";
                editIndex = -1;
            });

            window.closeModal = function () {
                modal.style.display = "none";
            };

            saveProjectBtn.addEventListener("click", function () {
                let name = document.getElementById("projectName").value;
                let team = document.getElementById("projectTeam").value;
                let status = document.getElementById("projectStatus").value;

                if (editIndex === -1) {
                    projects.push({ name, team, status });
                } else {
                    projects[editIndex] = { name, team, status };
                }

                localStorage.setItem("projects", JSON.stringify(projects));
                renderProjects();
                closeModal();
            });

            window.deleteProject = function (index) {
                projects.splice(index, 1);
                localStorage.setItem("projects", JSON.stringify(projects));
                renderProjects();
            };

            renderProjects();
        });
    </script>
</body>
</html>

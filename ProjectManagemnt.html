<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        nav {
            background: #1E293B;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-items ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 15px;
        }
        .menu-items ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .menu-items ul li a:hover {
            background: #38BDF8;
        }
        .dashboard {
            padding: 20px;
        }
        .boxes {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            text-align: center;
        }
        .activity {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .activity-data {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .reminder-btn {
            padding: 8px 15px;
            background-color: #38BDF8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo-name">Project Management</div>
        <div class="menu-items">
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Team</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </div>
    </nav>
    <section class="dashboard">
        <div class="boxes">
            <div class="box">
                <span>Total Projects</span>
                <span id="totalProjects">0</span>
            </div>
            <div class="box">
                <span>Ongoing Tasks</span>
                <span id="ongoingTasks">0</span>
            </div>
            <div class="box">
                <span>Completed Tasks</span>
                <span id="completedTasks">0</span>
            </div>
        </div>
        <div class="activity">
            <div class="activity-data" id="recentActivities">No recent activities.</div>
        </div>
    </section>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let projects = JSON.parse(localStorage.getItem("projects")) || [];
            document.getElementById("totalProjects").textContent = projects.length;
            document.getElementById("ongoingTasks").textContent = projects.filter(p => p.status === "Ongoing").length;
            document.getElementById("completedTasks").textContent = projects.filter(p => p.status === "Completed").length;
        });
    </script>
</body>
</html>
